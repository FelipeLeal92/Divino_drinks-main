<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acesso ao painel — Divino Drinks</title>
  <link rel="icon" href="/imagens/favicon.ico">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="login-page">
  <main class="login-layout">
    <a href="/" class="login-brand"><img src="/imagens/Logo/logo_footer.png" alt="Divino Drinks — voltar ao site"></a>
    <div class="login-content">
      <h1>Acesso ao painel</h1>
      <p class="login-description">Entre para cuidar do conteúdo do seu site.</p>
      <form action="/login" method="post" id="login-form">
        <div class="field"><label for="email">E-mail</label><input id="email" name="email" type="email" autocomplete="username" required></div>
        <div class="field"><label for="password">Senha</label><div class="password-field"><input id="password" name="password" type="password" autocomplete="current-password" required><button type="button" id="show-password" class="button quiet" aria-controls="password" aria-pressed="false">Mostrar</button></div></div>
        <p id="error-message" class="feedback" role="alert" hidden>E-mail ou senha incorretos. Confira seus dados e tente novamente.</p>
        <button class="button primary login-submit" type="submit">Entrar no painel</button>
      </form>
    </div>
    <a class="back-to-site" href="/">Voltar ao site</a>
  </main>
  <script src="/js/login.js" defer></script>
</body>
</html>
